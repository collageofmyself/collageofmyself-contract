# Dependency Review Action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          # Dev-only test/coverage tooling naturally drags in transitive
          # deps that get flagged; surface them as PR comments but don't
          # block merges on low/moderate findings.
          fail-on-severity: high
          fail-on-scopes: runtime
          warn-only: true
          comment-summary-in-pr: on-failure
