name: Run Foundry Test

on: [push]

permissions:
  contents: read

jobs:
  test_foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Yarn Install
        run: corepack yarn@1.22.22 install --frozen-lockfile
      - name: Run Forge Test
        run: forge test
